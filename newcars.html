<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Cars - Coming Soon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .coming-soon-container {
            max-width: 1000px;
            margin: 80px auto;
            padding: 50px 20px;
            text-align: center;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .coming-soon-container h1 {
            font-size: 48px;
            color: #000;
            margin-bottom: 10px;
        }
        .soon-indicator {
            display: inline-block;
            font-size: 60px;
            color: #FFD700;
            padding: 20px;
            border: 5px solid #FFD700;
            border-radius: 50%;
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }
        .coming-soon-container p {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .back-home-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #000;
            color: #FFD700;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }
        .back-home-btn:hover {
            background-color: #333;
            color: #fff;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="left">
            <a href="home.html" style="display: flex; align-items: center; text-decoration: none;">
                <img src="image/logo.jpg" alt="Logo" class="logo-img">
                <div class="brand">
                    <div class="brand-name">ROYAL CAR</div>
                    <div class="tagline">Your next adventure starts with us</div>
                </div>
            </a>
        </div>
        <div class="center">
            <!-- Search bar omitted -->
        </div>
        <div class="right">
            <a href="home.html" style="color: #FFD700; text-decoration: none; font-size: 14px; margin-right: 20px;">← Back to Home</a>
        </div>
    </div>

    <div class="coming-soon-container">
        <div class="soon-indicator"><i class="fas fa-car-side"></i></div>
        <h1>New Car Inventory is Launching Soon!</h1>
        <p>We are currently loading our complete catalog of brand new vehicles. Check back shortly to explore the latest models and best deals!</p>
        <a href="home.html" class="back-home-btn">Go Back to Home</a>
    </div>

</body>
</html>
