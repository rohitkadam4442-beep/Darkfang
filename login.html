<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Royal Car - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      text-align: center;
      background: #111;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      max-width: 350px;
      width: 100%;
    }

    .login-container img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #FFD700;
    }

    .brand-name {
      font-size: 26px;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 25px;
    }

    .login-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .user-btn {
      background: #FFD700;
      color: #000;
    }

    .user-btn:hover {
      background: #e6c200;
    }

    .admin-btn {
      background: transparent;
      border: 2px solid #FFD700;
      color: #FFD700;
    }

    .admin-btn:hover {
      background: #FFD700;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="image/logo.jpg" alt="Royal Car Logo">
    <div class="brand-name">ROYAL CAR</div>

    <button class="login-btn user-btn" onclick="window.location.href='user.html'">
      👤 User Login
    </button>

    <button class="login-btn admin-btn" onclick="window.location.href='admin.html'">
      🛠 Admin Login
    </button>
  </div>

</body>
</html>
