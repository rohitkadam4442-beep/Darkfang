<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        .car-detail {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            color: #222;
        }
        .car-detail-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .car-detail-header h1 {
            font-size: 32px;
            font-weight: 600;
            color: #111;
        }
        .car-detail-header .price {
            font-size: 24px;
            font-weight: bold;
            color: #e63946;
        }
        .car-detail-gallery {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .main-image {
            flex: 2;
            min-width: 300px;
        }
        .main-image img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .thumbnails {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 100px;
        }
        .thumbnails img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: border 0.2s;
            border: 2px solid transparent;
        }
        .thumbnails img:hover {
            border-color: #e63946;
        }
        .car-specs, .car-description {
            margin-bottom: 30px;
        }
        .car-specs h2, .car-description h2 {
            font-size: 24px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .spec-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }
        .spec-item h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
        }
        .spec-item p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .buy-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s;
            margin-right: 15px;
        }
        .buy-btn:hover {
            background-color: #d63030;
        }
        .address-btn {
            padding: 12px 25px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .address-btn:hover {
            background-color: #15a484;
        }
    </style>
</head>

<body>
    <div class="car-detail" data-uid=""> 

        <div class="car-detail-header">
            <h1 id="carName">Loading Car...</h1>
            <span class="price" id="carPrice"></span>
        </div>

        <div class="car-detail-gallery">
            <div class="main-image">
                <img id="carImage" src="" alt="Main Car Image">
            </div>
            <div class="thumbnails" id="carThumbnails"></div>
        </div>

        <div class="car-specs">
            <h2>Key Specifications</h2>
            <div class="specs-grid" id="carSpecs"></div>
        </div>

        <div class="car-description">
            <h2>Description</h2>
            <p id="carDescription">Explore detailed info about this car.</p>
        </div>

        <div class="car-specs">
            <h2>Available Variants</h2>
            <div class="specs-grid" id="carVariants"></div>
        </div>

        <div class="car-actions">
            <a href="interface.html" class="buy-btn" id="buyNowLink">Buy Now</a>
            <button class="address-btn" onclick="document.getElementById('dealershipAddress').style.display = 'block'">View Dealership Address</button>
        </div>

        <div class="car-address" style="margin-top: 30px;">
            <h2>Dealership Location</h2>
            <p id="dealershipAddress" style="display: none; padding: 15px; border-left: 5px solid #1abc9c; background: #f0fff0; color: #333; font-size: 16px;">
                **Car World Central**<br>
                123 Grand Auto Plaza, Industrial Area Phase IV, Auto City, 560001.
                <br><br>
                **Opening Hours:** Mon-Sat, 9:00 AM - 6:00 PM
            </p>
        </div>
    </div>

    <script src="car.js"></script>
    <script src="admin.js"></script>
    <script>
        // This function ensures the car ID is attached to the "Buy Now" link
        function updateBuyNowLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const carId = urlParams.get('id');
            const buyNowLink = document.getElementById('buyNowLink');

            if (carId && buyNowLink) {
                // Attach the car ID to the interface.html link
                buyNowLink.href = `interface.html?id=${carId}`; 
            }
        }

        window.addEventListener('load', updateBuyNowLink);
    </script>
</body>

</html>
