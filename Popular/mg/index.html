<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .car-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .car-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .car-info {
            padding: 15px;
        }
        .car-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .car-price {
            color: #e63946;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Available Cars</h1>
        <div class="car-grid" id="carGrid"></div>
    </div>

    <script src="data.js"></script>
    <script src="editor.js"></script> 
    
    <script>
        const carGrid = document.getElementById('carGrid');

        for (const id in carsData) {
            const car = carsData[id];
            const card = document.createElement('a');
            card.href = `details.html?id=${id}`;
            card.className = 'car-card';
            card.setAttribute('data-uid', id); 

            card.innerHTML = `
                <img src="${car.image}" alt="${car.name}" id="carImage">
                <div class="car-info">
                    <div class="car-name" id="carName">${car.name}</div>
                    <div class="car-price" id="carPrice">${car.price}</div>
                </div>
            `;
            carGrid.appendChild(card);
        }
    </script>
</body>
</html>
